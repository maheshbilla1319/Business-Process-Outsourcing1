<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Stackly BPO</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- AOS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/aos@2.3.1/dist/aos.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/404.css">
</head>

<body>

<!-- <!-- =====================================================
     PRELOADER
====================================================== -->

<div class="preloader" aria-hidden="true">

    <div class="loader">

        <span class="loader-dot"></span>

        <span>STACKLY</span>

    </div>

</div>





<!-- =====================================================
     404 MAIN
====================================================== -->

<main class="error-page">

    <!-- Animated circles -->

    <div class="error-circle circle-one"></div>
    <div class="error-circle circle-two"></div>
    <div class="error-circle circle-three"></div>


    <div class="container error-container">


        <!-- LEFT CONTENT -->

        <div
            class="error-content"
            data-aos="fade-right"
        >

            <span class="error-label">
                PAGE NOT FOUND
            </span>


            <h1 class="error-number">
                <span>4</span><span>0</span><span>4</span>
            </h1>


            <h2>
                Looks like this page
                <span>took a wrong turn.</span>
            </h2>


            <p>

                The page you're looking for doesn't exist or may have
                been moved. Let's get you back to better operations.

            </p>


            <div class="error-actions">

                <a
                    href="index.html"
                    class="error-btn primary"
                >

                    <span>
                        Back to Home Page
                    </span>

                    <i class="fa-solid fa-arrow-right"></i>

                </a>


            <a 
    href="javascript:void(0);" 
    class="error-btn secondary" 
    onclick="goBackPage()"
    aria-label="Go back to previous page"
>
    <span>Back to previous Page</span>
    <i class="fa-solid fa-arrow-up-right-from-square"></i>
</a>

            </div>


            <div class="error-meta">

                <span>
                    STACKLY BPO
                </span>

                <span>
                    404 / PAGE ERROR
                </span>

            </div>

        </div>


        <!-- RIGHT VISUAL -->

        <div
            class="error-visual"
            data-aos="fade-left"
        >

            <div class="visual-frame">

                <div class="visual-grid"></div>


                <div class="visual-center">

                    <div class="center-ring ring-one"></div>

                    <div class="center-ring ring-two"></div>

                    <div class="center-ring ring-three"></div>


                    <div class="center-number">
                        404
                    </div>

                </div>


                <div class="floating-card card-top">

                    <span>STATUS</span>

                    <strong>
                        LOST
                    </strong>

                </div>


                <div class="floating-card card-bottom">

                    <span>REDIRECT</span>

                    <strong>
                        HOME ↗
                    </strong>

                </div>


                <span class="visual-dot dot-one"></span>
                <span class="visual-dot dot-two"></span>
                <span class="visual-dot dot-three"></span>

            </div>

        </div>

    </div>

</main>





<!-- =====================================================
     AOS
====================================================== -->

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>


<!-- =====================================================
     GSAP
====================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>


<!-- =====================================================
     JS
====================================================== -->

<script src="js/404.js"></script>

</body>
</html>
